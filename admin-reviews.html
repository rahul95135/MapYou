<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Moderation — MapYou</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14213D; --paper:#FAF6ED; --marigold:#E8A33D; --route:#D64933;
    --verified:#2F7A5C; --slate:#5B6B7A; --line:rgba(20,33,61,0.12); --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; line-height:1.55; }
  h1,h2{ font-family:'Roboto Slab', serif; }
  .wrap{ max-width:640px; margin:0 auto; padding:40px 24px; }

  .pin-gate{ text-align:center; padding:60px 0; }
  .pin-gate input{
    padding:12px 16px; border:1.5px solid var(--line); border-radius:10px;
    font-size:1.1rem; text-align:center; letter-spacing:0.2em; width:160px; margin-top:16px;
  }
  .pin-gate button{
    display:block; margin:16px auto 0; background:var(--ink); color:#fff; border:none;
    padding:12px 28px; border-radius:999px; font-weight:600; cursor:pointer;
  }
  .pin-error{ color:var(--route); font-size:0.85rem; margin-top:10px; display:none; }
  .pin-error.show{ display:block; }

  .panel{ display:none; }
  .panel.show{ display:block; }
  .panel h1{ font-size:1.5rem; }
  .panel .sub{ color:var(--slate); font-size:0.9rem; margin-top:6px; margin-bottom:24px; }

  .review-card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; margin-bottom:14px;
  }
  .review-card .top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .review-card .name{ font-weight:700; }
  .review-card .business{ color:var(--slate); font-size:0.85rem; }
  .review-card .stars{ color:var(--marigold); font-size:1rem; white-space:nowrap; }
  .review-card .comment{ margin-top:10px; font-size:0.92rem; }
  .review-card .date{ font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:var(--slate); margin-top:10px; }
  .review-card .actions{ display:flex; gap:10px; margin-top:16px; }
  .review-card button{
    flex:1; padding:10px; border-radius:999px; font-weight:600; font-size:0.88rem; border:none; cursor:pointer;
  }
  .approve-btn{ background:var(--verified); color:#fff; }
  .reject-btn{ background:transparent; border:1.5px solid var(--route) !important; color:var(--route); }
  .empty-state{ text-align:center; color:var(--slate); padding:40px 0; font-size:0.9rem; }
</style>
</head>
<body>

<div class="wrap">

  <div class="pin-gate" id="pinGate">
    <img src="assets/logo-nav.png" alt="MapYou logo" style="width:48px; height:48px; margin-bottom:8px;">
    <h2>Review moderation</h2>
    <p style="color:var(--slate); font-size:0.9rem; margin-top:6px;">Enter your admin PIN to continue.</p>
    <input type="password" id="pinInput" inputmode="numeric" maxlength="6" placeholder="••••">
    <button id="pinSubmit">Unlock</button>
    <p class="pin-error" id="pinError">Incorrect PIN. Try again.</p>
  </div>

  <div class="panel" id="panel">
    <h1>Pending reviews</h1>
    <p class="sub">Approve to publish on the homepage, or reject to discard.</p>
    <div id="reviewList"></div>
  </div>

</div>

<script>
  let PIN = '';
  const pinGate = document.getElementById('pinGate');
  const pinInput = document.getElementById('pinInput');
  const pinError = document.getElementById('pinError');
  const panel = document.getElementById('panel');
  const reviewList = document.getElementById('reviewList');

  document.getElementById('pinSubmit').addEventListener('click', unlock);
  pinInput.addEventListener('keydown', e => { if(e.key === 'Enter') unlock(); });

  async function unlock(){
    const pin = pinInput.value.trim();
    if(!pin) return;
    const res = await fetch(`https://mapyou.netlify.app/api/moderate-review?pin=${encodeURIComponent(pin)}`);
    if(!res.ok){
      pinError.classList.add('show');
      return;
    }
    PIN = pin;
    pinError.classList.remove('show');
    pinGate.style.display = 'none';
    panel.classList.add('show');
    const data = await res.json();
    render(data.pending || []);
  }

  function render(pending){
    if(pending.length === 0){
      reviewList.innerHTML = '<div class="empty-state">No pending reviews right now.</div>';
      return;
    }
    reviewList.innerHTML = pending.map(r => `
      <div class="review-card" data-id="${r.id}">
        <div class="top">
          <div>
            <div class="name">${escapeHtml(r.name)}</div>
            <div class="business">${escapeHtml(r.business)}</div>
          </div>
          <div class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
        </div>
        <div class="comment">${escapeHtml(r.comment)}</div>
        <div class="date">${new Date(r.createdAt).toLocaleString('en-IN')}</div>
        <div class="actions">
          <button class="approve-btn" onclick="moderate('${r.id}','approve',this)">Approve</button>
          <button class="reject-btn" onclick="moderate('${r.id}','reject',this)">Reject</button>
        </div>
      </div>
    `).join('');
  }

  async function moderate(id, action, btn){
    btn.closest('.review-card').style.opacity = '0.5';
    btn.disabled = true;
    try{
      const res = await fetch('https://mapyou.netlify.app/api/moderate-review', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, action, pin: PIN }),
      });
      if(!res.ok) throw new Error();
      btn.closest('.review-card').remove();
      if(!reviewList.children.length){
        reviewList.innerHTML = '<div class="empty-state">No pending reviews right now.</div>';
      }
    } catch(err){
      alert('Something went wrong — please try again.');
      btn.closest('.review-card').style.opacity = '1';
      btn.disabled = false;
    }
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
